  </text>
  <text x="140" y="380" font-family="system-ui, sans-serif" font-weight="800" font-size="52" fill="url(#grad)" letter-spacing="-1">
    
  </text>

  <!-- Subtitle -->
  <text x="140" y="460" font-family="system-ui, sans-serif" font-weight="500" font-size="22" fill="#a3adcf">
